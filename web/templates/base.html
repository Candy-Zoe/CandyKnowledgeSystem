<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Candy知识库{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Candy知识库</div>
        <div class="nav-links">
            <a href="/" class="nav-link">首页</a>
            <a href="/knowledge-bases/" class="nav-link">知识库</a>
            <a href="/upload/" class="nav-link">上传</a>
            <a href="/documents/" class="nav-link">文档</a>
            <a href="/qa/" class="nav-link">问答</a>
            <a href="/conversations/" class="nav-link">对话</a>
            <a href="/summary/" class="nav-link">摘要</a>
            <a href="/batch-qa/" class="nav-link">批量</a>
            <a href="/ocr/" class="nav-link">OCR</a>
            <div class="nav-dropdown">
                <span class="nav-link">更多</span>
                <div class="nav-dropdown-menu">
                    <a href="/finetune/">模型微调</a>
                    <a href="/scheduler/">定时任务</a>
                    <a href="/stats/">使用统计</a>
                    <a href="/users/">用户管理</a>
                    <a href="/settings/">参数设置</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
