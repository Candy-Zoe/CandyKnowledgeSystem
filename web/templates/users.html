{% extends "base.html" %}
{% block title %}用户管理 - Candy知识库{% endblock %}
{% block content %}
<div class="page-header">
    <h2>用户管理</h2>
    <button class="btn btn-primary" onclick="showRegister()">注册用户</button>
</div>
<div id="registerForm" style="display:none;" class="section">
    <h3>注册新用户</h3>
    <input type="text" id="regUsername" placeholder="用户名" class="input-full">
    <input type="password" id="regPassword" placeholder="密码" class="input-full" style="margin-top:10px;">
    <select id="regRole" class="input-full" style="margin-top:10px;">
        <option value="user">普通用户</option>
        <option value="admin">管理员</option>
    </select>
    <button class="btn btn-primary" onclick="register()" style="margin-top:10px;">注册</button>
</div>
<table class="doc-table">
    <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.role }}</td>
            <td>{{ u.created_at }}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteUser({{ u.id }})">删除</button></td>
        </tr>
        {% endfor %}
        {% if not users %}<tr><td colspan="5" class="empty">暂无用户</td></tr>{% endif %}
    </tbody>
</table>
{% endblock %}
{% block scripts %}
<script>
function showRegister() { document.getElementById('registerForm').style.display='block'; }
function register() {
    const u=document.getElementById('regUsername').value.trim();
    const p=document.getElementById('regPassword').value;
    const r=document.getElementById('regRole').value;
    if(!u||!p){alert('请填写完整');return;}
    fetch('/users/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,role:r})})
        .then(r=>r.json()).then(d=>{if(d.error)alert(d.error);else location.reload();});
}
function deleteUser(id){if(!confirm('确定删除?'))return;fetch('/users/api/'+id,{method:'DELETE'}).then(()=>location.reload());}
</script>
{% endblock %}
