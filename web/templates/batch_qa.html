{% extends "base.html" %}
{% block title %}批量问答 - Candy知识库{% endblock %}
{% block content %}
<div class="page-header"><h2>批量问答</h2></div>
<div class="section">
    <h3>输入问题（每行一个）</h3>
    <textarea id="questions" rows="10" class="input-full" placeholder="什么是机器学习？&#10;深度学习有哪些应用？&#10;Python的优势是什么？"></textarea>
    <button class="btn btn-primary" onclick="runBatch()" style="margin-top:10px;">开始批量问答</button>
</div>
<div id="resultSection" class="section" style="display:none;">
    <h3>结果</h3>
    <div id="batchResults"></div>
    <button class="btn" onclick="exportBatch()" style="margin-top:10px;">导出CSV</button>
</div>
{% endblock %}
{% block scripts %}
<script>
let currentBatchId = null;
function runBatch() {
    const lines = document.getElementById('questions').value.split('\n').filter(l=>l.trim());
    if (!lines.length) { alert('请输入问题'); return; }
    fetch('/batch-qa/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({questions:lines})})
        .then(r=>r.json()).then(d=>{
            currentBatchId = d.batch_id;
            pollBatch();
        });
}
function pollBatch() {
    const timer = setInterval(()=>{
        fetch('/batch-qa/api/'+currentBatchId+'/status').then(r=>r.json()).then(d=>{
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('batchResults').innerHTML = d.results.map(r=>
                '<div class="search-result-item"><strong>'+r.question+'</strong><p>'+r.answer+'</p></div>'
            ).join('');
            if (d.completed >= d.results.length && d.results.length > 0) {
                const textarea = document.getElementById('questions');
                const total = textarea.value.split('\n').filter(l=>l.trim()).length;
                if (d.completed >= total) clearInterval(timer);
            }
        });
    }, 2000);
}
function exportBatch() {
    if (currentBatchId) window.location='/batch-qa/api/'+currentBatchId+'/export';
}
</script>
{% endblock %}
